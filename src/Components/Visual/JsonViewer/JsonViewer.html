<div class="slice-json-viewer__toolbar" hidden>
  <input class="slice-json-viewer__search" type="search" autocomplete="off" spellcheck="false" hidden>
  <span class="slice-json-viewer__count" hidden></span>
  <span class="slice-json-viewer__tools">
    <button type="button" class="slice-json-viewer__tool" data-action="expand"></button>
    <button type="button" class="slice-json-viewer__tool" data-action="collapse"></button>
  </span>
</div>
<ul class="slice-json-viewer__tree" role="tree"></ul>
<p class="slice-json-viewer__status" role="status" aria-live="polite"></p>
