<dialog class="slice-lightbox" aria-roledescription="image viewer">
  <div class="slice-lightbox__bar">
    <span class="slice-lightbox__count"></span>
    <div class="slice-lightbox__tools">
      <button type="button" class="slice-lightbox__tool slice-lightbox__zoom" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" class="slice-lightbox__zoom-plus"/></svg>
      </button>
      <button type="button" class="slice-lightbox__tool slice-lightbox__close">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
  </div>
  <div class="slice-lightbox__stage">
    <button type="button" class="slice-lightbox__nav slice-lightbox__nav--prev">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
    <figure class="slice-lightbox__figure">
      <div class="slice-lightbox__frame">
        <img class="slice-lightbox__img" alt="" draggable="false" decoding="async" />
        <span class="slice-lightbox__spinner" aria-hidden="true"></span>
        <p class="slice-lightbox__error" hidden></p>
      </div>
      <figcaption class="slice-lightbox__caption"></figcaption>
    </figure>
    <button type="button" class="slice-lightbox__nav slice-lightbox__nav--next">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
  </div>
  <div class="slice-lightbox__thumbs"></div>
</dialog>
