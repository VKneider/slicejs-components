<figure class="slice-quote__figure">
  <span class="slice-quote__mark" aria-hidden="true">“</span>
  <div class="slice-quote__rating" role="img" hidden></div>
  <blockquote class="slice-quote__text"></blockquote>
  <figcaption class="slice-quote__caption" hidden>
    <span class="slice-quote__avatar" hidden></span>
    <span class="slice-quote__who">
      <span class="slice-quote__author" hidden></span>
      <span class="slice-quote__meta" hidden></span>
      <cite class="slice-quote__source" hidden></cite>
    </span>
  </figcaption>
</figure>
